name: "Vulnerability Scan"

# vulnix matches published CVEs against what each host actually ships. A new
# advisory appears against a version that is already built and running, so this
# belongs on a schedule — a per-PR run would only re-report yesterday's
# findings and make every PR red. Triaged CVEs live in
# specs/security/vulnix-whitelist.toml; anything not listed there fails the job.
on:
  schedule:
    - cron: "17 4 * * *" # nightly; off the hour to dodge the runner stampede
  workflow_dispatch:

permissions:
  contents: read

# Let a nightly run finish before the next starts, and keep a manual run from
# colliding with it.
concurrency:
  group: vulnix
  cancel-in-progress: false

jobs:
  vulnix:
    runs-on: ubuntu-latest
    # A cold cache build of a NixOS toplevel is the slow part; the Cachix
    # cache usually substitutes it. Raise this if a host starts timing out.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Every host in flake.nix's nixosConfigurations except mgmt, which is
        # excluded on purpose. mgmt needs mongodb, mongodb is unfree, so
        # cache.nixos.org has no substitute and the runner would have to
        # compile it. That build works, but only serially (verified on an
        # 8-core/15 GiB host: `--cores 1 --max-jobs 1` compiled and linked
        # mongod), which does not fit a runner's memory or the timeout below.
        # Scan it from a machine that can build it:
        #   make vulnix VULNIX_HOST=mgmt NIX_BUILD_ARGS="--cores 1 --max-jobs 1"
        # The exclusion is stated rather than left as a missing host: an
        # absent host in this list reads as "clean", which it is not.
        host: [edge-router, media, rocinante, app-node, dev-1]
    steps:
      # Supply-chain hardening: actions pinned to immutable SHAs (floating @vX
      # tags are MUTABLE). Same pins as test.yml; bump by changing the SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@8887e596b4ee1134dae06b98d573bd674693f47c
        # v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@18cf96c7c98e048e10a83abd92116114cd8504be
        # v14
        with:
          name: mycache
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      # The Makefile recipe, not a copy of it, so CI and a local run cannot
      # drift. Exit 2 means advisories not in the whitelist were found.
      - name: Scan ${{ matrix.host }}
        run: make vulnix VULNIX_HOST=${{ matrix.host }}
