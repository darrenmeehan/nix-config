# nothing to bump to. Re-check when the lock advances.
["glibc-2.44-57"]
cve = ["CVE-2026-5435", "CVE-2026-6238"]
until = "2027-02-01"
comment = "no newer glibc in nixpkgs master (still 2.44)"

["zlib-1.3.2"]
