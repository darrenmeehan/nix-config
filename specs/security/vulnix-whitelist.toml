# vulnix whitelist — CVEs that vulnix must stop reporting for a package.
# `make vulnix` passes this file (-w). One table per package, named the way
# vulnix prints it (name-version, or just the name to match any version);
# "*" whitelists a CVE everywhere. Keys: cve, until (YYYY-MM-DD), issue_url,
# comment.
#
# Baseline 2026-11-22 against flake.lock nixpkgs d5cc683 (edge-router closure:
# 33 findings, 30 unique CVEs, 12 packages). vulnix matches name + version only
# and does not read advisory ranges carefully, so most entries here are NOT
# accepted risk — they are reports that are already fixed or never applied.
# Each comment says which, quoting the advisory. Explicit CVE ids are used
# rather than a bare package name so a NEW advisory on the same package is
# still reported.
#
# Check before extending:
#   nix eval --raw .#nixosConfigurations.edge-router.pkgs.<pkg>.version
#   nix eval --raw github:NixOS/nixpkgs/nixos-unstable#<pkg>.version

# --- Already fixed in the version shipped (advisory range says so) ----------
# These need no action beyond the whitelist; vulnix is matching the package
# name, not the patched version.

["perl-5.42.3"]
cve = ["CVE-2026-13221", "CVE-2026-57432", "CVE-2026-8376"]
until = "2027-05-01"
comment = "advisories: affected before 5.42.3-RC1; this is 5.42.3 final. CVE-2026-8376 is also 32-bit-only"

["perl-5.42.3-env"]
cve = ["CVE-2026-13221", "CVE-2026-57432", "CVE-2026-8376"]
until = "2027-05-01"
comment = "same perl, wrapper output"

["brotli-1.2.1"]
cve = ["CVE-2026-111497"]
until = "2027-02-01"
comment = "advisory: affected 1.0.3 through 1.2.0; 1.2.1 IS the fix release"

["jq-1.8.2"]
cve = ["CVE-2026-44777"]
until = "2027-02-01"
comment = "advisory: 'in 1.8.2rc1 and earlier'; this is the 1.8.2 release"

["dbus-1"]
cve = ["CVE-2022-42010", "CVE-2022-42011", "CVE-2022-42012"]
until = "2027-02-01"
comment = "fixed in 1.12.24/1.14.4/1.15.2, and this ships dbus 1.16.2; the flagged path is NixOS's generated dbus docs output, not the daemon"

# --- Not this software (name collision) -------------------------------------
["zlib-1.3.2"]
cve = ["CVE-2026-27820", "CVE-2023-6992"]
until = "2027-02-01"
comment = "CVE-2026-27820 is the Ruby zlib GEM (Zlib::GzipReader), CVE-2023-6992 is Cloudflare's zlib fork ('upstream repository is not affected'); this is madler zlib C 1.3.2"

# --- Disputed / wrong architecture ------------------------------------------
["gcc-16.2.0"]
cve = ["CVE-2023-4039"]
until = "2027-05-01"
comment = "DISPUTED by GCC; AArch64 -fstack-protector on dynamically-sized locals. Hosts are x86_64, and only libgcc/xgcc reach a runtime closure"

# --- Real, but the vulnerable code is not in the closure --------------------
["sqlite-3.54.0"]
cve = ["CVE-2026-119586"]
until = "2027-02-01"
comment = "in the sqlite3 CLI's .recover command; this closure ships the lib output only (verified: no /bin/sqlite3)"

# --- Real and unfixed: fixes exist only as upstream commits, no release -----
# These are the ones actually worth watching. `until` is deliberately short:
# when a tagged release lands and nixpkgs picks it up, they come back.
["dhcpcd-10.3.2"]
cve = ["CVE-2026-56113", "CVE-2026-56114", "CVE-2026-56116", "CVE-2026-56117"]
until = "2026-12-15"
comment = "fixed in commits 5733d3c/2f00c7b/708b4a5/78ea09e, no release. edge-router runs dhcpcd on the WAN interface, so the same-link attacker is the ISP segment"

["libssh2-1.11.1"]
cve = [
  "CVE-2025-15661",
  "CVE-2026-55199",
  "CVE-2026-55200",
  "CVE-2026-58050",
  "CVE-2026-58051",
  "CVE-2026-66032",
  "CVE-2026-66033",
  "CVE-2026-66034",
  "CVE-2026-66035",
  "CVE-2026-7598",
]
until = "2026-12-15"
comment = "all 'through 1.11.1, fixed in commit <sha>'; 1.11.1 is the latest release. Client side: needs a hostile SSH/SFTP server, and here libssh2 is only pulled in by curl"

# CVE-2026-6238 is noise (affected 2.0.1 through 2.43, this is 2.44).
# CVE-2026-5435 is open in 2.44 and newer with no patch release.
["glibc-2.44-57"]
cve = ["CVE-2026-5435", "CVE-2026-6238"]
until = "2026-12-15"
comment = "fixes are upstream commits, no release. Both hit the deprecated BIND-derived ns_printrrf/ns_printrr/fp_nquery debug functions, which no normal program calls"

["bison-3.8.2"]
cve = ["CVE-2026-56389", "CVE-2026-56390"]
until = "2027-05-01"
comment = "fixed in commits 3169c1e/8d101c1, no release. Needs bison --html run on an attacker-supplied grammar; build-time only, no service does this"
