# --- Build-time only: present in the closure, never fed runtime input -------
# These are toolchain entries (compilers/interpreters). The advisories need
# attacker-controlled input handed to the tool, which no service on these
# hosts does. Long expiry: this is a stable judgement, not a waiting game.
["bison-3.8.2"]
cve = ["CVE-2026-56389", "CVE-2026-56390"]
until = "2027-05-01"
comment = "build-time parser generator; --html report path not used at runtime"

["gcc-16.2.0"]
cve = ["CVE-2023-4039"]
until = "2027-05-01"
comment = "compiler; aarch64 -fstack-protector issue, x86_64 hosts"

["perl-5.42.3"]
cve = ["CVE-2026-13221", "CVE-2026-57432", "CVE-2026-8376"]
until = "2027-05-01"
comment = "interpreter used by build/activation scripts, not exposed input"

["perl-5.42.3-env"]
cve = ["CVE-2026-13221", "CVE-2026-57432", "CVE-2026-8376"]
until = "2027-05-01"
comment = "same perl, wrapper output"
